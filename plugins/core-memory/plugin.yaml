name: core-memory
description: "Persistent working memory — automatically recalls relevant past context at session start and prompts saving learnings at session end"

session:
  mcp:
    - journal-mcp
  capabilities:
    - recall-memory
  skills:
    - skills/write-journal/SKILL.md
  hooks:
    SessionStart:
      - name: "Working memory priming"
        command: |
          echo "## Working Memory"
          echo ""
          echo "You have persistent working memory. Use the recall-memory skill (/core-memory:recall-memory) to search past context; use the write-journal skill (/core-memory:write-journal) at session end to save learnings."
          exit 0
    Stop:
      - name: "Validate journal.md"
        command: |
          # Gate artifact: task/journal.md, the task directory's journal.md.
          # stdin goes straight to jq; dash's echo would rewrite backslash
          # escapes inside the JSON and lose stop_hook_active.
          STOP_ACTIVE=$(jq -r '.stop_hook_active // false' 2>/dev/null)
          if [ "$STOP_ACTIVE" = "true" ]; then exit 0; fi
          P="${CLAUDE_PROJECT_DIR:-.}"
          T="${TWINKLE_TASK_DIR:-$P/task}"
          # The runner names the MCP servers it wired in TWINKLE_MCP_SERVERS.
          case ",${TWINKLE_MCP_SERVERS:-}," in
            *,journal-mcp,*) ;;
            *) exit 0 ;;
          esac
          if [ ! -f "$T/journal.md" ]; then
            echo "BLOCKED: You must write $T/journal.md with learnings before ending the session. Use the write-journal skill (/core-memory:write-journal)." >&2
            exit 2
          fi
          exit 0
